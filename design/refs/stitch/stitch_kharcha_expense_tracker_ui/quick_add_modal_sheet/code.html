<script>
  let rawAmount = "349";

  function updateAmountDisplay() {
    const display = document.getElementById("amount-val");
    if (!rawAmount || rawAmount === "") {
      display.textContent = "0";
    } else {
      display.textContent = rawAmount;
    }
  }

  function inputKey(val) {
    if (rawAmount === "0" && val !== ".") {
      rawAmount = val;
    } else {
      if (val === "." && rawAmount.includes(".")) return;
      if (rawAmount.length < 9) {
        rawAmount += val;
      }
    }
    updateAmountDisplay();
  }

  function backspaceKey() {
    if (rawAmount.length > 0) {
      rawAmount = rawAmount.slice(0, -1);
    }
    if (rawAmount === "") {
      rawAmount = "0";
    }
    updateAmountDisplay();
  }

  function selectCategory(el, isInitial) {
    const container = document.getElementById("category-container");
    const chips = container.querySelectorAll("button");
    chips.forEach(chip => {
      chip.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-surface-container text-on-surface-variant font-label-md text-label-md transition-all hover:bg-surface-container-high";
    });
    el.className = "cat-pill active flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-tertiary-container/20 text-tertiary font-label-md text-label-md transition-all shadow-sm";
  }

  function selectAccount(btn) {
    const btns = document.querySelectorAll(".acc-btn");
    btns.forEach(b => {
      b.className = "acc-btn flex items-center justify-center gap-1 py-2 px-1 rounded-lg bg-transparent text-on-surface-variant hover:text-on-surface font-label-md text-label-md transition-all truncate";
    });
    btn.className = "acc-btn active flex items-center justify-center gap-1 py-2 px-1 rounded-lg bg-surface-container-high text-primary font-label-md text-label-md shadow-sm transition-all truncate";
  }

  function toggleSMS() {
    const badge = document.getElementById("sms-toggle");
    const banner = document.getElementById("sms-context");
    const note = document.getElementById("expense-note");
    
    if (rawAmount === "349") {
      rawAmount = "0";
      banner.style.display = "none";
      note.value = "";
      badge.classList.remove("bg-surface-container-high");
      badge.classList.add("bg-surface-container-low", "opacity-50");
    } else {
      rawAmount = "349";
      banner.style.display = "flex";
      note.value = "Zepto Snacks";
      badge.classList.add("bg-surface-container-high");
      badge.classList.remove("bg-surface-container-low", "opacity-50");
    }
    updateAmountDisplay();
  }

  function saveExpense() {
    const btn = document.getElementById("save-btn");
    btn.innerHTML = `<span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span><span>Saved!</span>`;
    btn.classList.add("bg-secondary");
    setTimeout(() => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        btn.innerHTML = `<span class="material-symbols-outlined text-[20px]">check</span><span>Done</span>`;
      }
    }, 450);
  }

  // Initialize initial default mock state
  updateAmountDisplay();
</script><div class="w-full flex justify-center pb-space-sm mt-auto"><div class="w-32 h-1 rounded-full bg-on-surface-variant/40"></div></div></main>
